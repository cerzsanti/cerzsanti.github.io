
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Arquitectura || MIIC — CERZ</title>
  <link rel="stylesheet" href="./galeria.css">
</head>
<body>

  <div class="page">

    <header class="site-header">
      <a href="../" class="brand">CERZ</a>
    </header>

    <main class="content">

      <div class="section-heading">
        <h1>ARQUITECTURA <span>|| MIIC</span></h1>
        <span class="subtitle">ARCHIVO DE PROYECTOS</span>
      </div>

      <div class="section-label">01 / PROYECTOS</div>

      <section class="gallery" aria-label="Galería de arquitectura">

        <button class="project" type="button"
                data-index="0">
          <div class="project-image">
            <img
              src="./imagenes/CASA%20MARGEN%20_FRENTE_FOTO.png"
              alt="Casa Margen — Frente"
              loading="eager">
          </div>
          <div class="project-caption">
            <span>CASA MARGEN-La Reserva</span>
            <span class="arrow">↗</span>
          </div>
        </button>

        <button class="project" type="button"
                data-index="1">
          <div class="project-image">
            <img
              src="./imagenes/Propuesta%20casa%20La%20Reserva.png"
              alt="Propuesta Casa en La Reserva"
              loading="lazy">
          </div>
          <div class="project-caption">
            <span>LA RESERVA</span>
            <span class="arrow">↗</span>
          </div>
        </button>

        <button class="project" type="button"
                data-index="2">
          <div class="project-image">
            <img
              src="./imagenes/Propuesta%20Viv%20Colectiva%20Yerba%20Buena.png"
              alt="Propuesta de Acceso- Vivienda Colectiva- Yerba Buena"
              loading="lazy">
          </div>
          <div class="project-caption">
            <span>VIVIENDA COLECTIVA / YERBA BUENA</span>
            <span class="arrow">↗</span>
          </div>
        </button>

      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 — Powered by Santiago Hernán Fernández Cardone</span>
      <a href="../">VOLVER</a>
    </footer>

  </div>

  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true"
       aria-label="Visor de proyectos"
       aria-hidden="true">

    <button class="viewer-close" id="closeViewer"
            aria-label="Cerrar visor">×</button>

    <button class="viewer-prev" id="prevImage"
            aria-label="Imagen anterior">←</button>

    <div class="viewer-content">
      <img id="viewerImage" src="" alt="">
      <div class="viewer-caption">
        <span id="viewerTitle"></span>
        <span id="viewerCounter"></span>
      </div>
    </div>

    <button class="viewer-next" id="nextImage"
            aria-label="Imagen siguiente">→</button>
  </div>

  <div class="custom-cursor" id="customCursor"></div>

  <script src="./galeria.js"></script>
</body>
</html>
