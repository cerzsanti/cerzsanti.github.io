
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>Contacto — CERZ</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        /* CONTACTO */

        .contact-info {
            grid-column: 3;
            grid-row: 3;

            align-self: end;
            justify-self: stretch;

            width: 100%;
            min-width: 0;

            position: relative;
            z-index: 2;
        }

        .contact-line {
            display: flex;
            align-items: center;

            min-height: min(7dvh, 70px);
            padding: 10px 0;

            border-top: 1px solid var(--line);

            font-size: clamp(10px, 0.95vw, 15px);
            letter-spacing: 0.10em;
            line-height: 1.5;
        }

        .contact-line a {
            color: inherit;
            text-decoration: none;
        }

        .contact-line a:hover {
            opacity: 0.65;
        }

        /* TABLET */

        @media (max-width: 1100px) {

            .contact-info {
                grid-column: 2 / 4;
                justify-self: end;

                width: min(100%, 430px);
            }
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .contact-info {
                grid-column: 1 / 4;
                grid-row: 3;

                width: 100%;
            }

            .contact-line {
                min-height: min(7dvh, 65px);

                font-size: clamp(10px, 2.7vw, 12px);
                letter-spacing: 0.05em;
            }
        }
    </style>

    <script src="../cursor.js" defer></script>
</head>

<body>

    <div class="page">

        <header class="header">
            <a href="../" class="header-brand">
                CERZ
            </a>
        </header>

        <main class="main-grid">

            <div class="identity">
                <img
                    src="../logo-cerz-blanco-transparente.png"
                    alt="Símbolo CERZ"
                    class="logo"
                >
            </div>

            <section
                class="contact-info"
                aria-label="Datos de contacto">

                <div class="contact-line">
                    Arq. Santiago Hernán Fernández Cardone
                </div>

                <div class="contact-line">
                    <a href="tel:+5493816681755">
                        +54 9 3816681755
                    </a>
                </div>

                <div class="contact-line">
                    Argentina
                </div>

            </section>

        </main>

        <footer class="footer">
            <span class="copyright">
                © 2026 — Powered by Santiago Hernán Fernández Cardone
            </span>
        </footer>

    </div>

    <div
        class="custom-cursor"
        aria-hidden="true">
    </div>

</body>
</html>
