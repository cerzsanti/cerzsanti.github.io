
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>Música — CERZ</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .music-page {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: 55px minmax(0,1fr) 48px;
            padding:
                clamp(12px,3vh,35px)
                var(--margin)
                clamp(10px,2vh,22px);
        }

        .music-main {
            min-height: 0;
            overflow-y: auto;
            padding: 42px 0 55px;
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;
        }

        .music-heading {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 42px;
        }

        .music-heading h1 {
            margin: 0;
            font-size: clamp(20px,3vw,40px);
            font-weight: 400;
            letter-spacing: .04em;
        }

        .music-heading span,
        .section-label {
            font-size: 11px;
            letter-spacing: .16em;
        }

        /* REPRODUCTOR */

        .audio-section {
            margin-bottom: 80px;
        }

        .section-label {
            display: block;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .audio-player {
            padding: 28px 0;
        }

        .track-index {
            color: #999;
            font-size: 10px;
            letter-spacing: .16em;
        }

        .track-title {
            margin: 14px 0 30px;
            font-size: clamp(18px,2.5vw,32px);
            font-weight: 400;
            letter-spacing: .04em;
            overflow-wrap: anywhere;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .play-button {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 1px solid var(--fg);
            border-radius: 50%;
            background: transparent;
            color: var(--fg);
            cursor: pointer;
        }

        .play-button:hover {
            background: #292929;
        }

        .play-button svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .progress-area {
            flex: 1;
            min-width: 0;
        }

        .progress {
            width: 100%;
            height: 20px;
            margin: 0;
            display: block;
            cursor: pointer;
            accent-color: var(--fg);
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            letter-spacing: .1em;
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-shrink: 0;
        }

        .volume svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }

        .volume input {
            width: 75px;
            accent-color: var(--fg);
            cursor: pointer;
        }

        .audio-status {
            margin: 18px 0 0;
            min-height: 15px;
            color: #999;
            font-size: 10px;
            letter-spacing: .1em;
        }

        /* DJ SETS */

        .music-gallery {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 42px 25px;
            margin-top: 28px;
        }

        .video-card {
            display: block;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .video-image {
            position: relative;
            aspect-ratio: 16/9;
            background: #242424;
            overflow: hidden;
        }

        .video-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter .3s, transform .4s;
        }

        .video-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.025);
        }

        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 42px;
            border: 1px solid white;
            border-radius: 50%;
            background: rgba(0,0,0,.25);
            transform: translate(-50%,-50%);
        }

        .video-play::after {
            content: "";
            position: absolute;
            top: 13px;
            left: 17px;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid white;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line);
        }

        .video-title {
            font-size: 12px;
            letter-spacing: .1em;
        }

        .video-number {
            color: #999;
            font-size: 11px;
        }

        /* FOOTER */

        .music-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-top: 1px solid var(--line);
        }

        .music-footer .copyright {
            position: static;
        }

        .back-link {
            color: inherit;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: .12em;
        }

        @media (max-width:600px) {
            .music-page {
                grid-template-rows: 45px minmax(0,1fr) 42px;
                padding: 12px 24px;
            }

            .music-main {
                padding: 28px 0 45px;
            }

            .music-heading {
                margin-bottom: 30px;
            }

            .music-heading h1 {
                font-size: 24px;
            }

            .music-heading span,
            .section-label {
                font-size: 9px;
            }

            .audio-section {
                margin-bottom: 60px;
            }

            .player-controls {
                gap: 14px;
            }

            .volume input {
                width: 45px;
            }

            .music-gallery {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .music-footer .copyright {
                font-size: 8px;
                letter-spacing: 0;
            }

            .back-link {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>
    <div class="music-page">

        <header class="header">
            <a href="../" class="header-brand">CERZ</a>
        </header>

        <main class="music-main">

            <div class="music-heading">
                <h1>MÚSICA</h1>
                <span>ARCHIVO SONORO / AUDIOVISUAL</span>
            </div>

            <section class="audio-section"
                     aria-label="Archivo sonoro">

                <span class="section-label">
                    01 / CANCIONES
                </span>

                <div class="audio-player">

                    <span class="track-index">
                        CERZ — AUDIO 001 / OCT 2026
                    </span>

                    <h2 class="track-title">
                        DEMO01_OCT2026_
                    </h2>

                    <audio id="audio"
                           preload="metadata"
                           src="./audio/DEMO01_OCT2026_.mp3">
                    </audio>

                    <div class="player-controls">

                        <button id="play"
                                class="play-button"
                                type="button"
                                aria-label="Reproducir">

                            <svg id="play-icon"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M8 5 L19 12 L8 19 Z"/>
                            </svg>
                        </button>

                        <div class="progress-area">

                            <input id="progress"
                                   class="progress"
                                   type="range"
                                   min="0"
                                   max="1000"
                                   value="0"
                                   aria-label="Posición de reproducción">

                            <div class="time-row">
                                <span id="current-time">00:00</span>
                                <span id="duration">00:00</span>
                            </div>

                        </div>

                        <div class="volume">

                            <svg viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M4 9H8L13 5V19L8 15H4Z"/>
                                <path d="M16 9Q19 12 16 15"/>
                            </svg>

                            <input id="volume"
                                   type="range"
                                   min="0"
                                   max="1"
                                   step="0.01"
                                   value="0.8"
                                   aria-label="Volumen">
                        </div>

                    </div>

                    <p id="audio-status"
                       class="audio-status"
                       role="status"></p>

                </div>
            </section>

            <section aria-label="DJ sets">

                <span class="section-label">
                    02 / DJ SETS
                </span>

                <div class="music-gallery"
                     id="music-gallery"></div>

            </section>

        </main>

        <footer class="music-footer">

            <span class="copyright">
                © 2026 — Powered by Santiago Hernán Fernández Cardone
            </span>

            <a href="../" class="back-link">VOLVER</a>

        </footer>

    </div>

    <script src="./musica.js" defer></script>
</body>
</html>
