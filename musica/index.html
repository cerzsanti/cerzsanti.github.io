
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <title>Música — CERZ</title>

    <link rel="stylesheet" href="./musica.css">
</head>

<body>

    <div class="page">

        <header class="site-header">
            <a href="../" class="brand">CERZ</a>
        </header>

        <main class="music-main">

            <section class="music-section"
                     aria-label="Canciones">

                <div class="section-heading">
                    <span>01 / CANCIONES</span>
                </div>

                <!-- TODO DICHO — NUEVO LANZAMIENTO -->

                <article class="release">

                    <div class="release-cover">
                        <img
                            src="./TODO%20DICHO.png"
                            alt="Portada de Todo Dicho — CERZ"
                            loading="eager">
                    </div>

                    <div class="release-content">

                        <div class="release-information">

                            <span class="release-index">
                                CERZ / NUEVO LANZAMIENTO
                            </span>

                            <h1 class="release-title">
                                TODO DICHO
                            </h1>

                            <span class="release-description">
                                Single
                            </span>

                        </div>

                        <div class="audio-player">

                            <audio
                                preload="metadata"
                                src="./TODO%20DICHO.mp3">
                            </audio>

                            <div class="player-controls">

                                <button
                                    class="play-button"
                                    type="button"
                                    aria-label="Reproducir">

                                    <svg
                                        class="play-icon"
                                        viewBox="0 0 24 24"
                                        aria-hidden="true">
                                        <path d="M8 5 L19 12 L8 19 Z"/>
                                    </svg>

                                </button>

                                <div class="progress-area">

                                    <input
                                        class="progress"
                                        type="range"
                                        min="0"
                                        max="1000"
                                        value="0"
                                        aria-label="Posición de reproducción">

                                    <div class="time-row">
                                        <span class="current-time">00:00</span>
                                        <span class="duration">00:00</span>
                                    </div>

                                </div>

                                <div class="volume-control">

                                    <button
                                        class="mute-button"
                                        type="button"
                                        aria-label="Silenciar">

                                        <svg viewBox="0 0 24 24"
                                             aria-hidden="true">

                                            <path
                                                d="M4 9 H8 L13 5 V19 L8 15 H4 Z"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="1.5"/>

                                            <path
                                                d="M16 9 Q19 12 16 15"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="1.5"/>

                                        </svg>

                                    </button>

                                    <input
                                        class="volume"
                                        type="range"
                                        min="0"
                                        max="1"
                                        step="0.01"
                                        value="0.8"
                                        aria-label="Volumen">

                                </div>

                            </div>

                            <p class="audio-status"
                               role="status"></p>

                        </div>

                    </div>

                </article>

                <!-- BUENOS MODALES — LANZAMIENTO ANTERIOR -->

                <article class="release">

                    <div class="release-cover">
                        <img
                            src="./CERZ_BUENOS MODALES_tapa.jpg"
                            alt="Portada de Buenos Modales — CERZ"
                            loading="lazy">
                    </div>

                    <div class="release-content">

                        <div class="release-information">

                            <span class="release-index">
                                CERZ
                            </span>

                            <h2 class="release-title">
                                BUENOS MODALES
                            </h2>

                            <span class="release-description">
                                Single
                            </span>

                        </div>

                        <div class="audio-player">

                            <audio
                                preload="metadata"
                                src="./02_OCT%20Project.mp3">
                            </audio>

                            <div class="player-controls">

                                <button
                                    class="play-button"
                                    type="button"
                                    aria-label="Reproducir">

                                    <svg
                                        class="play-icon"
                                        viewBox="0 0 24 24"
                                        aria-hidden="true">
                                        <path d="M8 5 L19 12 L8 19 Z"/>
                                    </svg>

                                </button>

                                <div class="progress-area">

                                    <input
                                        class="progress"
                                        type="range"
                                        min="0"
                                        max="1000"
                                        value="0"
                                        aria-label="Posición de reproducción">

                                    <div class="time-row">
                                        <span class="current-time">00:00</span>
                                        <span class="duration">00:00</span>
                                    </div>

                                </div>

                                <div class="volume-control">

                                    <button
                                        class="mute-button"
                                        type="button"
                                        aria-label="Silenciar">

                                        <svg viewBox="0 0 24 24"
                                             aria-hidden="true">

                                            <path
                                                d="M4 9 H8 L13 5 V19 L8 15 H4 Z"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="1.5"/>

                                            <path
                                                d="M16 9 Q19 12 16 15"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="1.5"/>

                                        </svg>

                                    </button>

                                    <input
                                        class="volume"
                                        type="range"
                                        min="0"
                                        max="1"
                                        step="0.01"
                                        value="0.8"
                                        aria-label="Volumen">

                                </div>

                            </div>

                            <p class="audio-status"
                               role="status"></p>

                        </div>

                    </div>

                </article>

            </section>

            <!-- DJ SETS -->

            <section class="music-section dj-section"
                     aria-label="DJ sets">

                <div class="section-heading">
                    <span>02 / DJ SETS</span>
                </div>

                <div id="music-gallery"
                     class="music-gallery">
                </div>

            </section>

        </main>

        <footer class="site-footer">

            <span class="copyright">
                © 2026 — Powered by Santiago Hernán Fernández Cardone
            </span>

            <a href="../" class="back-link">
                VOLVER
            </a>

        </footer>

    </div>

    <script src="../cursor.js" defer></script>
    <script src="./musica.js" defer></script>

</body>
</html>
